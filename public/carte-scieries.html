t S = DATA.scieries, REGIONS = DATA.regions;
const PROJ = (lon, lat) => [ (lon + 5.5) * 1.04 * 111 * 0.66, (51.5 - lat) * 1.04 * 111 * 0.66 ];
let filter = 'all', query = '', selId = null;

const svg = document.getElementById('map'), g = document.getElementById('zoomg');

function applyVB(){ svg.setAttribute('viewBox', vb.x+' '+vb.y+' '+vb.w+' '+vb.h); }
REGIONS.forEach(r => { const p = document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d', r.d); p.setAttribute('class','region'); p.appendChild(document.createTextNode('')); g.appendChild(p); });

const geo = S.filter(s => s.lat !== null && s.lat > 41 && s.lat < 51.5 && s.lon > -5.5 && s.lon < 9.7);
geo.forEach(s => {

  c.setAttribute('cx',x); c.setAttribute('cy',y);
  c.setAttribute('r', s.cible ? 6 : s.etat === 'C' ? 3.2 : 4.2);
  c.setAttribute('fill', s.cible ? '#f5b301' : s.etat === 'C' ? '#c0392b' : '#2e8b57');

  c.addEventListener('mouseenter', e => showTip(e, s));
  c.addEventListener('mousemove', e => showTip(e, s));
  c.addEventListener('mouseleave', () => tooltip.style.display = 'none');
  c.addEventListener('click', () => select(s.id, true));
  g.appendChild(c);
  s._x = x; s._y = y;
});

const tooltip = document.getElementById('tooltip');
function showTip(e, s){
  tooltip.style.display = 'block';
  tooltip.innerHTML = '<b>' + esc(s.nom) + '</b><br/>' + esc(s.cp + ' ' + s.ville) + (s.cible ? '<br/>⭐ Cible succession' : '') + (s.etat === 'C' ? '<br/>(cessée)' : '');
  const r = document.getElementById('mapwrap').getBoundingClientRect();
  tooltip.style.left = Math.min(e.clientX - r.left + 12, r.width - 250) + 'px';
  tooltip.style.top = (e.clientY - r.top - 8) + 'px';
}
function esc(t){ return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

// zoom/pan
svg.addEventListener('wheel', e => { e.preventDefault();
  const k = e.deltaY > 0 ? 1.18 : 1/1.18;
  const pt = point(e);
  vb = { x: pt.x - (pt.x - vb.x) * k, y: pt.y - (pt.y - vb.y) * k, w: vb.w * k, h: vb.h * k };

  if (vb.x < 0){vb.x=0;} if (vb.y < 0){vb.y=0;}

function point(e){ const r = svg.getBoundingClientRect();
  return { x: vb.x + (e.clientX - r.left) / r.width * vb.w, y: vb.y + (e.clientY - r.top) / r.height * vb.h }; }

}

  if (s.dirigeants && s.dirigeants.length){
    dir = '<p style="margin-top:6px"><b>Dirigeants :</b></p>' + s.dirigeants.map(x =>
      '<p>• ' + esc(x.nom) + (x.age ? ' (' + x.age + ' ans)' : '') + '<br/><span style="color:#7a8a7d">' + esc(x.qualite||'') + '</span></p>').join('');
  }
  b.innerHTML = `<h3>${esc(s.nom)}</h3>
    <p><b>SIREN :</b> ${esc(s.siren)}</p>
    <p>${esc(s.rue)}<br/>${esc(s.cp)} ${esc(s.ville)}</p>
    ${s.tel ? '<p>📞 ' + esc(s.tel) + '</p>' : ''}
    ${s.web ? '<p>🌐 <a href="'+esc(s.web)+'" target="_blank" rel="noopener">'+esc(s.web)+'</a></p>' : ''}
    ${s.ca ? '<p><b>CA :</b> ' + s.ca.toLocaleString('fr-FR') + ' €</p>' : ''}
    ${s.cible ? '<span class="tag" style="background:#f5b301">⭐ ' + esc(s.categorie) + '</span><p>' + esc(s.verdict) + '</p><p style="color:#7a8a7d">' + esc(s.detail) + '</p>' : ''}
    ${s.etat==='C' ? '<span class="tag" style="background:#c0392b;color:#fff">Société cessée</span>' : ''}
    ${dir}
    <p style="margin-top:8px;font-size:.66rem;color:#98a89b">Source : registre national des entreprises (API SIRENE)</p>`;
  d.style.display = 'block';
  if (fly && s._x !== undefined){
    vb = { x: Math.max(0, s._x - 60), y: Math.max(0, s._y - 60), w: 120, h: 120 };
    applyVB();
  }
}
document.getElementById('search').addEventListener('input', e => { query = e.target.value.trim(); renderList(); });
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('.fbtn'); if (!b) return;
  document.querySelectorAll('.fbtn').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); filter = b.dataset.f; renderList();
});
renderList();
</script>
