  const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('cx',x); c.setAttribute('cy',y);
  c.setAttribute('r', s.etat === 'C' ? 4.5 : 6);
  c.setAttribute('fill', s.etat === 'C' ? '#c0392b' : '#f5b301');
  c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width', 1.5);
  if (s.etat === 'C') c.setAttribute('opacity', .8);
  c.style.cursor = 'pointer'; s._x = x; s._y = y;
  c.addEventListener('mouseenter', e => showTip(e, s));
  c.addEventListener('mousemove', e => showTip(e, s));
  c.addEventListener('mouseleave', () => tooltip.style.display = 'none');
  c.addEventListener('click', () => select(s.id, true));
  g.appendChild(c); });
const tooltip = document.getElementById('tooltip');
function esc(t){ return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function showTip(e, s){ tooltip.style.display = 'block';
  tooltip.innerHTML = '<b>'+esc(s.nom)+'</b><br/>'+esc(s.cp+' '+s.ville)+(s.contact?'<br/>👤 '+esc(s.contact):'')+(s.etat==='C'?'<br/>(cessée)':'');
  const r = document.getElementById('mapwrap').getBoundingClientRect();
  tooltip.style.left = Math.min(e.clientX - r.left + 12, r.width - 250) + 'px';
  tooltip.style.top = (e.clientY - r.top - 8) + 'px'; }
svg.addEventListener('wheel', e => { e.preventDefault();
  const k = e.deltaY > 0 ? 1.18 : 1/1.18; const pt = point(e);
  vb = { x: pt.x - (pt.x - vb.x) * k, y: pt.y - (pt.y - vb.y) * k, w: vb.w * k, h: vb.h * k };
  vb.w = Math.max(40, Math.min(800, vb.w)); vb.h = vb.w;
  if (vb.x < 0){vb.x=0;} if (vb.y < 0){vb.y=0;}
  if (vb.x + vb.w > 800){vb.x = 800 - vb.w;} if (vb.y + vb.h > 800){vb.y = 800 - vb.h;} applyVB(); });
function point(e){ const r = svg.getBoundingClientRect();
  return { x: vb.x + (e.clientX - r.left) / r.width * vb.w, y: vb.y + (e.clientY - r.top) / r.height * vb.h }; }
let drag = null;
svg.addEventListener('mousedown', e => { drag = {sx:e.clientX, sy:e.clientY, vx:vb.x, vy:vb.y}; svg.style.cursor='grabbing'; });
window.addEventListener('mouseup', () => { drag = null; svg.style.cursor='grab'; });
window.addEventListener('mousemove', e => { if(!drag) return; const r = svg.getBoundingClientRect();
  vb.x = Math.max(0, Math.min(800 - vb.w, drag.vx - (e.clientX - drag.sx) / r.width * vb.w));
  vb.y = Math.max(0, Math.min(800 - vb.h, drag.vy - (e.clientY - drag.sy) / r.height * vb.h)); applyVB(); });
function visible(s){ if (query){ const q = query.toLowerCase();
  const hay = (s.nom+' '+s.ville+' '+s.cp+' '+s.siren+' '+s.region).toLowerCase(); if (!hay.includes(q)) return false; } return true; }
function renderList(){ const list = document.getElementById('list'); const items = S.filter(visible);
  list.innerHTML = items.length === 0 ? '<div style="padding:14px;font-size:.8rem;color:#888">Aucun résultat</div>'
   : items.map(s => '<div class="item '+(selId===s.id?'sel':'')+'" data-id="'+s.id+'"><div class="nm">'+esc(s.nom)+(s.etat==='C'?' <span style="font-size:.62rem;background:#e2e2e2;color:#777;padding:1px 6px;border-radius:8px">cessée</span>':'')+'</div><div class="ct">'+esc(s.cp)+' '+esc(s.ville)+(s.region?' · '+esc(s.region):'')+'</div></div>').join('');
  list.querySelectorAll('.item').forEach(el => el.onclick = () => select(el.dataset.id, true)); }
function select(id, fly){ selId = id; renderList();
  const s = S.find(x => x.id === id); if (!s) return;
  document.getElementById('dbody').innerHTML = '<h3>'+esc(s.nom)+'</h3>'
   +'<p><b>SIREN :</b> '+esc(s.siren)+'</p>'
   +'<p>'+esc(s.rue)+'<br/>'+esc(s.cp)+' '+esc(s.ville)+'</p>'
   +(s.contact?'<p>👤 '+esc(s.contact)+(s.cmail?' · <a href="mailto:'+esc(s.cmail)+'">'+esc(s.cmail)+'</a>':'')+'</p>':'')
   +(s.tel?'<p>📞 '+esc(s.tel)+'</p>':'')
   +(s.web?'<p>🌐 <a href="'+esc(s.web)+'" target="_blank" rel="noopener">'+esc(s.web)+'</a></p>':'')
   +(s.etat==='C'?'<p><span style="background:#c0392b;color:#fff;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:8px">Société cessée (01/07/2020)</span></p>':'')
   +'<p style="margin-top:8px;font-size:.66rem;color:#98a89b">Source : fichier « prospects pellet excel - mis à jour » · Zoho CRM</p>';
  document.getElementById('detail').style.display = 'block';
  if (fly && s._x !== undefined){ vb = { x: Math.max(0, s._x - 60), y: Math.max(0, s._y - 60), w: 120, h: 120 }; applyVB(); } }
document.getElementById('search').addEventListener('input', e => { query = e.target.value.trim(); renderList(); });
renderList();
</script>
